{% extends "base.html" %}
{% block title %}Регистрация — EventHUB{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2 class="auth-title">Регистрация</h2>
        <p class="auth-subtitle">Создайте аккаунт для участия в мероприятиях</p>
        
        <form method="POST" action="{{ url_for('auth.register') }}" class="auth-form">
            <div class="form-group">
                <label class="form-label">Имя и Фамилия</label>
                <input type="text" name="full_name" class="form-input" placeholder="Иван Иванов" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-input" placeholder="ivan@example.com" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Пароль</label>
                <input type="password" name="password" class="form-input" placeholder="Минимум 6 символов" required minlength="6">
            </div>
            
            <div class="form-group">
                <label class="form-label">Подтверждение пароля</label>
                <input type="password" name="confirm_password" class="form-input" placeholder="Повторите пароль" required>
            </div>

            <div class="form-group">
                <label class="form-label">Номер телефона</label>
                <input type="tel" name="phone" class="form-input" 
                       placeholder="+7 (999) 000-00-00" 
                       required 
                       pattern="\+?[0-9\s\-\(\)]{10,18}"
                       title="Введите корректный номер телефона (минимум 10 цифр)">
                <small style="display: block; margin-top: 4px; color: #6B7280; font-size: 11px;">
                    Используется для связи с организатором и восстановления доступа
                </small>
            </div>
            
            <div class="form-group">
                <label class="form-label">Пароль</label>
                <input type="password" name="password" class="form-input" placeholder="Минимум 6 символов" required minlength="6">
            </div>
            
            <button type="submit" class="btn btn--primary btn--full">Зарегистрироваться</button>
        </form>
        
        <div class="auth-footer">
            Уже есть аккаунт? <a href="{{ url_for('auth.login') }}">Войти</a>
        </div>
    </div>
</div>
{% endblock %}
